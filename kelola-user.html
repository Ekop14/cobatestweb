<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kelola User - Gudang Clean</title>
    <link rel="icon" type="image/png" href="https://companieslogo.com/img/orig/UVRBF-fdcd1dc7.png?t=1720244494">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-['Inter'] min-h-screen relative bg-[#0a0a1f] text-white">
    
    <div class="background-mesh"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div></div>
    <div class="noise-overlay"></div>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>
    <aside id="sidebar" class="sidebar flex flex-col h-screen">
        <div id="sidebar-slot"></div>
    </aside>

    <div class="flex min-h-screen">
        <main class="flex-1 w-full overflow-y-auto h-screen">
            
            <!-- HEADER -->
            <header class="sticky top-0 z-20 glass-header px-4 sm:px-6 py-4 flex items-center justify-between">
                <div class="flex items-center gap-3 sm:gap-4">
                    <button id="sidebarToggle" class="lg:hidden text-white/70 hover:text-white p-2 rounded-lg hover:bg-white/10 transition">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
                    </button>
                    <div>
                        <h2 class="text-lg sm:text-xl font-bold text-white">Kelola User</h2>
                        <p class="text-white/50 text-xs sm:text-sm">Manajemen akun pengguna sistem</p>
                    </div>
                </div>
                <button type="button" id="logoutBtn" class="flex items-center gap-2 px-3 py-2 rounded-lg bg-red-500/20 hover:bg-red-500/30 border border-red-500/30 text-red-300 hover:text-red-200 transition">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                    <span class="hidden sm:inline text-sm font-medium">Logout</span>
                </button>
            </header>

            <!-- CONTENT -->
            <div class="px-4 sm:px-6 py-6 max-w-7xl mx-auto">
                
                <!-- Info Banner -->
                <div class="glass-card !p-4 mb-6 bg-gradient-to-r from-purple-600/20 to-pink-600/20 border-purple-500/30 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-purple-500/20 flex items-center justify-center flex-shrink-0">
                        <svg class="h-5 w-5 text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                        </svg>
                    </div>
                    <div>
                        <h3 class="text-white font-semibold text-sm">Mode Administrator</h3>
                        <p class="text-white/60 text-xs">Hanya supervisor yang dapat mengakses halaman ini.</p>
                    </div>
                </div>

                <!-- Search & Stats -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                    <div class="stat-card">
                        <div class="stat-icon bg-blue-500/20 text-blue-400">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                        </div>
                        <div><p class="text-white/50 text-xs uppercase">Total User</p><p id="statTotalUsers" class="text-2xl font-bold text-white mt-1">0</p></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon bg-green-500/20 text-green-400">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        </div>
                        <div><p class="text-white/50 text-xs uppercase">Staff</p><p id="statStaffUsers" class="text-2xl font-bold text-white mt-1">0</p></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon bg-purple-500/20 text-purple-400">
                            <svg class="w-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
                        </div>
                        <div><p class="text-white/50 text-xs uppercase">Supervisor</p><p id="statSupervisorUsers" class="text-2xl font-bold text-white mt-1">0</p></div>
                    </div>
                </div>

                <!-- Search Bar -->
                <div class="glass-card p-4 mb-6">
                    <div class="flex gap-3">
                        <div class="flex-1 relative">
                            <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-5 w-5 text-white/40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                            <input type="text" id="searchUser" placeholder="Cari nama atau email..." class="glass-input w-full pl-10 pr-4 py-2.5 text-white">
                        </div>
                        <button id="refreshUsersBtn" class="glass-button-outline px-4 py-2.5">
                            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                            <span class="hidden sm:inline">Refresh</span>
                        </button>
                    </div>
                </div>

                <!-- Tabel User -->
                <div class="glass-card !p-0 overflow-hidden">
                    <div class="p-5 border-b border-white/10">
                        <h3 class="text-white font-semibold flex items-center gap-2">
                            <svg class="h-5 w-5 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                            Daftar Pengguna
                        </h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full report-table">
                            <thead>
                                <tr class="border-b border-white/10 bg-white/5">
                                    <th class="px-4 py-3 text-left">User</th>
                                    <th class="px-4 py-3 text-left">Email</th>
                                    <th class="px-4 py-3 text-center">Role</th>
                                    <th class="px-4 py-3 text-left">Terdaftar</th>
                                    <th class="px-4 py-3 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody">
                                <tr><td colspan="5" class="text-center py-8"><div class="spinner mx-auto"></div><p class="text-white/50 mt-2">Memuat data...</p></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Modal Konfirmasi Hapus -->
    <div id="deleteModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="glass-card w-full max-w-md !p-6">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-12 h-12 rounded-full bg-red-500/20 flex items-center justify-center">
                    <svg class="h-6 w-6 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                </div>
                <div>
                    <h3 class="text-xl font-bold text-white">Hapus User?</h3>
                    <p class="text-white/60 text-sm">Tindakan ini tidak dapat dibatalkan.</p>
                </div>
            </div>
            <div class="bg-white/5 rounded-lg p-3 mb-4">
                <p class="text-sm text-white/70">User yang akan dihapus:</p>
                <p id="deleteUserName" class="text-white font-semibold"></p>
                <p id="deleteUserEmail" class="text-white/60 text-xs"></p>
            </div>
            <div class="flex gap-3 justify-end">
                <button type="button" onclick="closeDeleteModal()" class="px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20 text-white text-sm transition">Batal</button>
                <button type="button" id="confirmDeleteBtn" class="px-4 py-2 rounded-lg bg-red-500 hover:bg-red-600 text-white text-sm font-medium transition">Hapus Permanen</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
