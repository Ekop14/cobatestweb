<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Masuk - Gudang Clean</title>
    <link rel="icon" type="image/png" href="https://companieslogo.com/img/orig/UVRBF-fdcd1dc7.png?t=1720244494">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-['Inter'] min-h-screen relative bg-[#0a0a1f] text-white flex items-center justify-center p-4">
    
    <!-- BACKGROUND ELEMENTS -->
    <div class="background-mesh">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div class="noise-overlay"></div>

    <!-- LOGIN CARD -->
    <div class="glass-card w-full max-w-md !p-8 relative z-10">
        
        <!-- Logo & Title -->
        <div class="text-center mb-8">
            <div class="glass-icon w-16 h-16 mx-auto mb-4 flex items-center justify-center">
                <img src="https://companieslogo.com/img/orig/UVRBF-fdcd1dc7.png?t=1720244494" alt="Logo" class="h-10 w-auto object-contain">
            </div>
            <h1 class="text-2xl font-bold text-white mb-1">Selamat Datang Kembali</h1>
            <p class="text-white/60 text-sm">Masuk ke sistem Gudang Clean</p>
        </div>

        <!-- Form Login -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-white/70 text-sm font-medium mb-2">Email</label>
                <input type="email" id="email" required class="glass-input w-full py-3 px-4 text-white placeholder-white/30" placeholder="nama@perusahaan.com">
            </div>

            <div>
                <label class="block text-white/70 text-sm font-medium mb-2">Password</label>
                <div class="relative">
                    <input type="password" id="password" required class="glass-input w-full py-3 px-4 text-white placeholder-white/30" placeholder="Masukkan password">
                    <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-white/50 hover:text-white transition">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="glass-button w-full !py-3 text-base mt-6">
                <span id="btnText">Masuk</span>
            </button>
        </form>

        <!-- Divider -->
        <div class="relative flex items-center my-6">
            <div class="flex-grow border-t border-white/10"></div>
            <span class="flex-shrink mx-4 text-white/40 text-xs uppercase">atau</span>
            <div class="flex-grow border-t border-white/10"></div>
        </div>

        <!-- Tombol Login Biometrik -->
        <button type="button" id="biometricLoginBtn" class="glass-button-outline w-full !py-3 text-base hidden">
            <svg class="h-5 w-5 text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4" />
            </svg>
            <span id="biometricBtnText">Masuk dengan Sidik Jari</span>
        </button>

        <p id="biometricStatus" class="text-center text-xs text-white/40 mt-3 hidden"></p>

        <!-- Tombol Hapus Sidik Jari -->
        <button type="button" id="removeBiometricBtn" class="text-xs text-red-400 hover:text-red-300 mt-2 hidden underline block mx-auto">
            Hapus Sidik Jari Terdaftar
        </button>

        <!-- Link ke Register -->
        <div class="text-center mt-6 pt-6 border-t border-white/10">
            <p class="text-white/60 text-sm">Belum punya akun? 
                <a href="register.html" class="text-blue-400 hover:text-blue-300 font-medium transition">Daftar di sini</a>
            </p>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
