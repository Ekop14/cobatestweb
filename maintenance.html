<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sedang Dalam Perawatan</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .icon { font-size: 80px; margin-bottom: 20px; animation: pulse 2s infinite; }
        h1 { font-size: 2.5rem; margin-bottom: 15px; color: #38bdf8; }
        p { font-size: 1.1rem; color: #94a3b8; max-width: 500px; line-height: 1.6; margin-bottom: 30px; }
        .loader {
            width: 50px; height: 50px;
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        
        /* Tombol rahasia untuk admin (hanya terlihat jika di-hover atau tahu caranya) */
        .admin-bypass {
            margin-top: 50px;
            font-size: 0.8rem;
            color: #334155;
            text-decoration: none;
            cursor: default;
        }
        .admin-bypass:hover { color: #475569; cursor: pointer; }
    </style>
</head>
<body>
    <div class="icon">🛠️</div>
    <h1>Sedang Dalam Perawatan</h1>
    <p>Kami sedang melakukan pembaruan sistem untuk memberikan pengalaman yang lebih baik. Website akan segera kembali normal. Terima kasih atas kesabaran Anda.</p>
    <div class="loader"></div>

    <!-- Trik Bypass untuk Admin: Tambahkan ?bypass=RAHASIA123 di URL -->
    <script>
        // Ganti 'RAHASIA123' dengan kode rahasia Anda sendiri
        const BYPASS_SECRET = 'eko123456'; 
        const urlParams = new URLSearchParams(window.location.search);
        
        if (urlParams.get('bypass') === BYPASS_SECRET) {
            localStorage.setItem('maintenance_bypass', 'true');
            alert('Mode Admin Diaktifkan. Anda sekarang bisa mengakses seluruh website.');
            window.location.href = '/'; // Kembali ke halaman utama
        }
    </script>
</body>
</html>
