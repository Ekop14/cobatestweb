<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APD Ceklist - Gudang Clean</title>
    <link rel="icon" type="image/png" href="https://companieslogo.com/img/orig/UVRBF-fdcd1dc7.png?t=1720244494">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-['Inter'] min-h-screen relative bg-[#0a0a1f] text-white">
    
    <div class="background-mesh"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div></div>
    <div class="noise-overlay"></div>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>
    <aside id="sidebar" class="sidebar flex flex-col h-screen">
        <div id="sidebar-slot"></div>
    </aside>

    <div class="flex min-h-screen">
        <main class="flex-1 w-full overflow-y-auto h-screen">
            
            <!-- HEADER -->
            <header class="sticky top-0 z-20 glass-header px-4 sm:px-6 py-4 flex items-center justify-between">
                <div class="flex items-center gap-3 sm:gap-4">
                    <button id="sidebarToggle" class="lg:hidden text-white/70 hover:text-white p-2 rounded-lg hover:bg-white/10 transition">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
                    </button>
                    <div>
                        <h2 class="text-lg sm:text-xl font-bold text-white">APD Ceklist</h2>
                        <p class="text-white/50 text-xs sm:text-sm">Kelengkapan Alat Pelindung Diri</p>
                    </div>
                </div>
                <button type="button" id="logoutBtn" class="flex items-center gap-2 px-3 py-2 rounded-lg bg-red-500/20 hover:bg-red-500/30 border border-red-500/30 text-red-300 hover:text-red-200 transition">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                    <span class="hidden sm:inline text-sm font-medium">Logout</span>
                </button>
            </header>

            <!-- CONTENT -->
            <div class="px-4 sm:px-6 py-6 max-w-4xl mx-auto">
                
                <!-- Info Banner -->
                <div class="glass-card !p-4 mb-6 bg-gradient-to-r from-blue-600/20 to-cyan-600/20 border-blue-500/30 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-blue-500/20 flex items-center justify-center flex-shrink-0">
                        <svg class="h-5 w-5 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                        </svg>
                    </div>
                    <div>
                        <h3 class="text-white font-semibold text-sm">Safety First!</h3>
                        <p class="text-white/60 text-xs">Pastikan semua APD digunakan dengan benar sebelum bekerja.</p>
                    </div>
                </div>

                <!-- Date Display -->
                <div class="glass-card !p-4 mb-6 text-center">
                    <p class="text-white/60 text-xs uppercase tracking-wider mb-1">Tanggal</p>
                    <p id="currentDate" class="text-white font-semibold text-lg"></p>
                </div>

                <!-- Progress Card -->
                <div class="glass-card !p-5 mb-6">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-white/70 text-sm font-medium">Progress APD</span>
                        <span id="apdProgressText" class="text-white font-bold text-lg">0%</span>
                    </div>
                    <div class="glass-progress">
                        <div id="apdProgressBar" class="glass-progress-fill" style="width: 0%"></div>
                    </div>
                    <p class="text-white/50 text-xs mt-2"><span id="apdCompletedCount">0</span> dari <span id="apdTotalCount">5</span> item terpenuhi</p>
                </div>

                <!-- APD Checklist Items -->
                <div class="glass-card !p-5 mb-6">
                    <h3 class="text-white font-semibold mb-4 flex items-center gap-2">
                        <svg class="h-5 w-5 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                        </svg>
                        Kelengkapan APD (5 Item)
                    </h3>
                    
                    <div class="space-y-3">
                        
                        <!-- Item 1: Seragam Sesuai Peraturan -->
                        <label class="checklist-item flex items-center gap-3 p-4 rounded-xl bg-white/5 hover:bg-white/8 transition cursor-pointer">
                            <input type="checkbox" class="glass-checkbox apd-checkbox" data-item="Seragam sesuai peraturan">
                            <div class="flex-1">
                                <p class="checklist-text text-white font-medium">1. Menggunakan Seragam Sesuai Peraturan</p>
                                <p class="text-white/50 text-xs">Seragam kerja lengkap sesuai standar perusahaan</p>
                            </div>
                            <span class="text-2xl">👔</span>
                        </label>

                        <!-- Item 2: Sepatu Safety -->
                        <label class="checklist-item flex items-center gap-3 p-4 rounded-xl bg-white/5 hover:bg-white/8 transition cursor-pointer">
                            <input type="checkbox" class="glass-checkbox apd-checkbox" data-item="Sepatu Safety">
                            <div class="flex-1">
                                <p class="checklist-text text-white font-medium">2. Menggunakan Sepatu Safety</p>
                                <p class="text-white/50 text-xs">Pelindung kaki dari benturan & benda tajam</p>
                            </div>
                            <span class="text-2xl">👢</span>
                        </label>

                        <!-- Item 3: Topi Pelindung Kepala -->
                        <label class="checklist-item flex items-center gap-3 p-4 rounded-xl bg-white/5 hover:bg-white/8 transition cursor-pointer">
                            <input type="checkbox" class="glass-checkbox apd-checkbox" data-item="Topi pelindung kepala">
                            <div class="flex-1">
                                <p class="checklist-text text-white font-medium">3. Menggunakan Topi Pelindung Kepala</p>
                                <p class="text-white/50 text-xs">Hard hat sesuai standar yang ditentukan</p>
                            </div>
                            <span class="text-2xl">⛑️</span>
                        </label>

                        <!-- Item 4: Tidak Memakai Aksesories -->
                        <label class="checklist-item flex items-center gap-3 p-4 rounded-xl bg-white/5 hover:bg-white/8 transition cursor-pointer">
                            <input type="checkbox" class="glass-checkbox apd-checkbox" data-item="Tidak memakai aksesories">
                            <div class="flex-1">
                                <p class="checklist-text text-white font-medium">4. Tidak Memakai Aksesories yang Dilarang</p>
                                <p class="text-white/50 text-xs">Tanpa jam tangan, gelang, cincin, atau perhiasan lain</p>
                            </div>
                            <span class="text-2xl">🚫</span>
                        </label>

                        <!-- Item 5: Kondisi Sehat & Fit -->
                        <label class="checklist-item flex items-center gap-3 p-4 rounded-xl bg-white/5 hover:bg-white/8 transition cursor-pointer">
                            <input type="checkbox" class="glass-checkbox apd-checkbox" data-item="Kondisi sehat dan fit">
                            <div class="flex-1">
                                <p class="checklist-text text-white font-medium">5. Kondisi Sehat dan Fit Saat Bertugas</p>
                                <p class="text-white/50 text-xs">Badan segar, tidak sakit, siap bekerja dengan aman</p>
                            </div>
                            <span class="text-2xl">💪</span>
                        </label>

                    </div>
                </div>

                <!-- Submit Button -->
                <button type="button" id="submitApdBtn" class="glass-button w-full !py-4 text-base font-semibold">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>Kirim Laporan APD</span>
                </button>

                <!-- Info Submit Hari Ini -->
                <div id="dailyApdInfo" class="hidden glass-card !p-4 mt-4 bg-green-500/10 border-green-500/30 text-center">
                    <p class="text-green-400 font-semibold">✅ Sudah Submit APD Hari Ini</p>
                    <p class="text-white/60 text-xs mt-1">Waktu: <span id="apdSubmissionTime">-</span></p>
                </div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
