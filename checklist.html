<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Checklist Kebersihan Gudang</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-['Inter'] min-h-screen relative bg-[#0a0a1f] text-white">
    <div class="background-mesh"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div></div>
    <div class="noise-overlay"></div>

    <!-- PENTING: Pindahkan Overlay dan Sidebar KE SINI (Di luar pembungkus konten) -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>
    <aside id="sidebar" class="sidebar flex flex-col h-screen">
        <div id="sidebar-slot"></div>
    </aside>

    <!-- Konten Utama: Hapus class 'relative z-10' agar tidak menjebak sidebar -->
    <div class="flex min-h-screen">
        <!-- MAIN CONTENT -->
        <main class="flex-1 w-full overflow-y-auto h-screen">
            <header class="sticky top-0 z-20 glass-header px-4 sm:px-6 py-4 flex items-center justify-between">
                <!-- ... isi header tetap sama ... -->
                <div class="flex items-center gap-3 sm:gap-4">
                    <button id="sidebarToggle" class="lg:hidden text-white/70 hover:text-white p-2 rounded-lg hover:bg-white/10 transition">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
                    </button>
                    <div>
                        <h2 class="text-lg sm:text-xl font-bold text-white">Checklist Kebersihan</h2>
                        <p class="text-white/50 text-xs sm:text-sm">Sabtu, 31 Oktober 2026</p>
                    </div>
                </div>
                <div class="flex items-center gap-2 sm:gap-3">
                    <!-- ... isi tombol header tetap sama ... -->
                    <div class="hidden md:flex items-center glass-input px-4 py-2">
                        <svg class="h-4 w-4 text-white/50 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                        <input type="text" id="searchInput" placeholder="Cari tugas..." class="bg-transparent outline-none text-white text-sm placeholder-white/40 w-40">
                    </div>
                    <button id="resetAllBtn" class="glass-button-outline !py-2 !px-3" title="Reset">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                    </button>
                    <button type="button" id="logoutBtn" class="flex items-center gap-2 px-3 py-2 rounded-lg bg-red-500/20 hover:bg-red-500/30 border border-red-500/30 text-red-300 hover:text-red-200 transition">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                        <span class="hidden sm:inline text-sm font-medium">Logout</span>
                    </button>
                </div>
            </header>

            <div class="px-4 sm:px-6 py-6 max-w-7xl mx-auto">
                <!-- ... isi stat cards, checklist cards, dan submit section TETAP SAMA PERSIS ... -->
                <!-- (Tidak perlu saya tulis ulang di sini agar tidak terlalu panjang, biarkan kode isi di dalamnya tetap seperti yang Anda miliki saat ini) -->
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="sidebar-loader.js"></script>
    <script src="script.js"></script>
</body>
</html>
