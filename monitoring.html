<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Input Monitoring RH & Temperature</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Hilangkan spinner pada input number */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-6">

    <div class="max-w-7xl mx-auto bg-white shadow-md rounded-lg p-6">
        
        <!-- Header Form -->
        <h2 class="text-xl font-bold text-center text-gray-800 mb-6 uppercase">
            Control Sheet Monitoring RH & Temperatures
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Location</label>
                <input type="text" value="WH-FG" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Section</label>
                <input type="text" value="STORAGE 1 (AREA POSM)" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Month</label>
                <select class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option>July</option>
                    <option>August</option>
                    <option>September</option>
                    <!-- Tambahkan bulan lain jika perlu -->
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Year</label>
                <input type="number" value="2026" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>

        <!-- Tabel Inputan -->
        <div class="overflow-x-auto">
            <table class="w-full border-collapse border border-gray-400 text-sm">
                <thead>
                    <tr class="bg-gray-100">
                        <th rowspan="2" class="border border-gray-400 px-2 py-2 w-10">No</th>
                        <th rowspan="2" class="border border-gray-400 px-2 py-2 w-20">Date</th>
                        <th colspan="4" class="border border-gray-400 px-2 py-2 text-center">Time of Checking</th>
                        <th rowspan="2" class="border border-gray-400 px-2 py-2 w-24">PIC Sign</th>
                        <th rowspan="2" class="border border-gray-400 px-2 py-2 w-32">Remark</th>
                    </tr>
                    <tr class="bg-gray-100">
                        <th class="border border-gray-400 px-2 py-1 w-20">8:00 AM<br><span class="font-normal text-xs">Temp(°C)</span></th>
                        <th class="border border-gray-400 px-2 py-1 w-20">RH(%)</th>
                        <th class="border border-gray-400 px-2 py-1 w-20">1:00 PM<br><span class="font-normal text-xs">Temp(°C)</span></th>
                        <th class="border border-gray-400 px-2 py-1 w-20">RH(%)</th>
                    </tr>
                </thead>
                <tbody id="inputRows">
                    <!-- Baris akan di-generate otomatis oleh script di bawah -->
                </tbody>
            </table>
        </div>

    </div>

    <!-- Script untuk generate baris inputan -->
    <script>
        const tbody = document.getElementById('inputRows');
        const totalDays = 31; // Ubah sesuai jumlah hari di bulan tersebut (28, 30, 31)
        const monthName = 'Jul'; // Ubah sesuai bulan

        for (let i = 1; i <= totalDays; i++) {
            // Tambahkan baris pemisah hitam di akhir minggu (hari ke 5, 12, 19, 26)
            if ([5, 12, 19, 26].includes(i)) {
                const breakRow = document.createElement('tr');
                breakRow.className = 'bg-black h-2';
                breakRow.innerHTML = '<td colspan="8"></td>';
                tbody.appendChild(breakRow);
            }

            const dateStr = `${String(i).padStart(2, '0')}-${monthName}`;
            
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-blue-50 transition-colors';
            tr.innerHTML = `
                <td class="border border-gray-400 text-center py-1 font-medium">${i}</td>
                <td class="border border-gray-400 text-center py-1">${dateStr}</td>
                <td class="border border-gray-400 p-1"><input type="number" step="0.1" class="w-full text-center focus:outline-none focus:bg-yellow-50" placeholder="0.0"></td>
                <td class="border border-gray-400 p-1"><input type="number" step="0.1" class="w-full text-center focus:outline-none focus:bg-yellow-50" placeholder="0.0"></td>
                <td class="border border-gray-400 p-1"><input type="number" step="0.1" class="w-full text-center focus:outline-none focus:bg-yellow-50" placeholder="0.0"></td>
                <td class="border border-gray-400 p-1"><input type="number" step="0.1" class="w-full text-center focus:outline-none focus:bg-yellow-50" placeholder="0.0"></td>
                <td class="border border-gray-400 p-1"><input type="text" class="w-full text-center focus:outline-none focus:bg-yellow-50"></td>
                <td class="border border-gray-400 p-1"><input type="text" class="w-full focus:outline-none focus:bg-yellow-50"></td>
            `;
            tbody.appendChild(tr);
        }
    </script>

</body>
</html>
