<!-- Card 2: Input Form -->
<div class="glass-card">
    <h2 class="text-lg font-bold mb-4 flex items-center gap-3" style="color: rgba(255,255,255,0.9);">
        <span class="glass-icon" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem;">📝</span>
        Input Data Harian
    </h2>

    <!-- User Info Banner -->
    <div class="glass-progress" style="margin-bottom: 1.5rem; padding: 1rem; background: rgba(102, 126, 234, 0.1); border: 1px solid rgba(102, 126, 234, 0.3);">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div>
                <span style="font-size: 0.85rem; color: rgba(255,255,255,0.6);">👤 Logged in as:</span>
                <span id="currentUserDisplay" style="font-weight: 600; color: white; margin-left: 0.5rem;">-</span>
            </div>
            <div>
                <span style="font-size: 0.85rem; color: rgba(255,255,255,0.6);">📅 Tanggal:</span>
                <span id="currentDateDisplay" style="font-weight: 600; color: white; margin-left: 0.5rem;">-</span>
            </div>
        </div>
    </div>

    <form id="inputForm" style="display: flex; flex-direction: column; gap: 1.5rem;">
        <!-- Hidden Fields untuk Tanggal & PIC -->
        <input type="hidden" id="inputDate">
        <input type="hidden" id="inputPIC">

        <div class="form-grid-4">
            <div>
                <label class="form-label">Waktu Cek</label>
                <select id="inputTime" required class="glass-input glass-select">
                    <option value="8:00 AM">8:00 AM (Pagi)</option>
                    <option value="1:00 PM">1:00 PM (Siang)</option>
                </select>
            </div>
            <div>
                <label class="form-label">Temperature (°C)</label>
                <input type="number" id="inputTemp" step="0.1" min="-10" max="60" required placeholder="0.0" class="glass-input">
            </div>
            <div>
                <label class="form-label">RH (%)</label>
                <input type="number" id="inputRH" step="0.1" min="0" max="100" required placeholder="0.0" class="glass-input">
            </div>
            <div>
                <label class="form-label">Remark</label>
                <input type="text" id="inputRemark" placeholder="Catatan kondisi (opsional)" class="glass-input">
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="no-print" style="display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 0.5rem;">
            <button type="submit" class="glass-button">
                <span>💾</span> Simpan Data
            </button>
            <button type="button" onclick="resetForm()" class="glass-button-outline">
                <span>🔄</span> Reset Form
            </button>
            <button type="button" onclick="exportToCSV()" class="glass-button-outline" style="border-color: rgba(139, 92, 246, 0.4); color: #c4b5fd;">
                <span>📊</span> Export CSV
            </button>
        </div>
    </form>
</div>
