<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Checklist Harian - Gudang Clean</title>
    <link rel="icon" type="image/png" href="https://companieslogo.com/img/orig/UVRBF-fdcd1dc7.png?t=1720244494">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-['Inter'] min-h-screen relative bg-[#0a0a1f] text-white">
    
    <div class="background-mesh"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div></div>
    <div class="noise-overlay"></div>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>
    <aside id="sidebar" class="sidebar flex flex-col h-screen">
        <div id="sidebar-slot"></div>
    </aside>

    <div class="flex min-h-screen">
        <main class="flex-1 w-full overflow-y-auto h-screen">
            
            <!-- HEADER -->
            <header class="sticky top-0 z-20 glass-header px-4 sm:px-6 py-4 flex items-center justify-between">
                <div class="flex items-center gap-3 sm:gap-4">
                    <button id="sidebarToggle" class="lg:hidden text-white/70 hover:text-white p-2 rounded-lg hover:bg-white/10 transition">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
                    </button>
                    <div>
                        <h2 class="text-lg sm:text-xl font-bold text-white">Checklist Harian</h2>
                        <p class="text-white/50 text-xs sm:text-sm">Checklist Kebersihan & Suhu Gudang</p>
                    </div>
                </div>
                <button type="button" id="logoutBtn" class="flex items-center gap-2 px-3 py-2 rounded-lg bg-red-500/20 hover:bg-red-500/30 border border-red-500/30 text-red-300 hover:text-red-200 transition">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                    <span class="hidden sm:inline text-sm font-medium">Logout</span>
                </button>
            </header>

            <!-- CONTENT -->
            <div class="px-4 sm:px-6 py-6 max-w-7xl mx-auto">
                
                <!-- INFO BANNER SUBMIT HARIAN -->
                <div id="dailySubmissionInfo" class="hidden glass-card !p-4 mb-6 bg-gradient-to-r from-green-600/20 to-emerald-600/20 border-green-500/30 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-green-500/20 flex items-center justify-center flex-shrink-0">
                        <svg class="h-5 w-5 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </div>
                    <div class="flex-1">
                        <h3 class="text-white font-semibold text-sm">✅ Checklist hari ini sudah disubmit</h3>
                        <p class="text-white/60 text-xs">Disubmit pada pukul <span id="submissionTimeDisplay" class="font-semibold text-green-300">-</span> • Anda bisa submit lagi besok</p>
                    </div>
                </div>

                <!-- TANGGAL -->
                <div class="glass-card !p-4 mb-6 text-center">
                    <p class="text-white/60 text-xs uppercase tracking-wider mb-1">Tanggal</p>
                    <p id="currentDate" class="text-white font-semibold text-lg"></p>
                </div>

                <!-- STAT CARDS (TERHUBUNG DATABASE) -->
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                    <div class="stat-card">
                        <div class="stat-icon bg-blue-500/20 text-blue-400">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                        </div>
                        <div>
                            <p class="text-white/50 text-xs uppercase">Total</p>
                            <p id="statTotalChecklist" class="text-2xl font-bold text-white mt-1">0</p>
                        </div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon bg-green-500/20 text-green-400">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                        <div>
                            <p class="text-white/50 text-xs uppercase">Selesai</p>
                            <p id="statSelesaiChecklist" class="text-2xl font-bold text-white mt-1">0</p>
                        </div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon bg-amber-500/20 text-amber-400">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                        <div>
                            <p class="text-white/50 text-xs uppercase">Pending</p>
                            <p id="statPendingChecklist" class="text-2xl font-bold text-white mt-1">0</p>
                        </div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon bg-purple-500/20 text-purple-400">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                            </svg>
                        </div>
                        <div>
                            <p class="text-white/50 text-xs uppercase">Progress</p>
                            <p id="statProgressChecklist" class="text-2xl font-bold text-white mt-1">0%</p>
                        </div>
                    </div>
                </div>

                <!-- PROGRESS BAR -->
                <div class="glass-card !p-5 mb-6">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-white/70 text-sm font-medium">Progress Hari Ini</span>
                        <span id="overallProgressText" class="text-white font-bold text-lg">0%</span>
                    </div>
                    <div class="glass-progress">
                        <div id="overallProgressBar" class="glass-progress-fill" style="width: 0%"></div>
                    </div>
                    <p class="text-white/50 text-xs mt-2">
                        <span id="completedCount">0</span> dari <span id="totalCount">0</span> item terpenuhi
                    </p>
                </div>

                <!-- CHECKLIST ITEMS (Contoh - sesuaikan dengan item Anda) -->
                <div class="glass-card !p-5 mb-6">
                    <h3 class="text-white font-semibold mb-4 flex items-center gap-2">
                        <svg class="h-5 w-5 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                        </svg>
                        Checklist Kebersihan Gudang
                    </h3>
                    
                    <div class="space-y-3">
                        <!-- Item 1 -->
                        <label class="checklist-item flex items-center gap-3 p-4 rounded-xl bg-white/5 hover:bg-white/8 transition cursor-pointer">
                            <input type="checkbox" class="glass-checkbox" data-item="Sapu lantai gudang">
                            <div class="flex-1">
                                <p class="checklist-text text-white font-medium">1. Sapu Lantai Gudang</p>
                                <p class="text-white/50 text-xs">Pastikan lantai bersih dari debu dan kotoran</p>
                            </div>
                            <span class="text-2xl">🧹</span>
                        </label>

                        <!-- Item 2 -->
                        <label class="checklist-item flex items-center gap-3 p-4 rounded-xl bg-white/5 hover:bg-white/8 transition cursor-pointer">
                            <input type="checkbox" class="glass-checkbox" data-item="Pel lantai gudang">
                            <div class="flex-1">
                                <p class="checklist-text text-white font-medium">2. Pel Lantai Gudang</p>
                                <p class="text-white/50 text-xs">Pel dengan air bersih dan disinfektan</p>
                            </div>
                            <span class="text-2xl">🪣</span>
                        </label>

                        <!-- Item 3 -->
                        <label class="checklist-item flex items-center gap-3 p-4 rounded-xl bg-white/5 hover:bg-white/8 transition cursor-pointer">
                            <input type="checkbox" class="glass-checkbox" data-item="Bersihkan rak dan palet">
                            <div class="flex-1">
                                <p class="checklist-text text-white font-medium">3. Bersihkan Rak dan Palet</p>
                                <p class="text-white/50 text-xs">Lap rak dan palet dari debu</p>
                            </div>
                            <span class="text-2xl">📦</span>
                        </label>

                        <!-- Item 4 -->
                        <label class="checklist-item flex items-center gap-3 p-4 rounded-xl bg-white/5 hover:bg-white/8 transition cursor-pointer">
                            <input type="checkbox" class="glass-checkbox" data-item="Cek area loading dock">
                            <div class="flex-1">
                                <p class="checklist-text text-white font-medium">4. Cek Area Loading Dock</p>
                                <p class="text-white/50 text-xs">Pastikan area loading bersih dan rapi</p>
                            </div>
                            <span class="text-2xl">🚛</span>
                        </label>

                        <!-- Item 5 -->
                        <label class="checklist-item flex items-center gap-3 p-4 rounded-xl bg-white/5 hover:bg-white/8 transition cursor-pointer">
                            <input type="checkbox" class="glass-checkbox" data-item="Buang sampah pada tempatnya">
                            <div class="flex-1">
                                <p class="checklist-text text-white font-medium">5. Buang Sampah pada Tempatnya</p>
                                <p class="text-white/50 text-xs">Kosongkan tempat sampah dan ganti plastik</p>
                            </div>
                            <span class="text-2xl">🗑️</span>
                        </label>
                    </div>
                </div>

                <!-- TOMBOL SUBMIT -->
                <button type="button" id="submitChecklistBtn" class="glass-button w-full !py-4 text-base font-semibold mb-4">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>Kirim Laporan Checklist</span>
                </button>

                <!-- Spacer -->
                <div class="h-4"></div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
