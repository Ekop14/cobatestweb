<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Gudang Clean</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-mesh">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div class="noise-overlay"></div>

    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; position: relative; z-index: 10;">
        <div class="glass-card" style="width: 100%; max-width: 400px;">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div class="glass-icon" style="display: inline-flex; padding: 1rem; margin-bottom: 1rem;">
                    <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
                </div>
                <h1 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem;">Buat Akun</h1>
                <p style="color: rgba(255,255,255,0.6); font-size: 0.9rem;">Daftar untuk mulai</p>
            </div>

            <form id="registerForm" style="display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <label style="display: block; font-size: 0.75rem; margin-bottom: 0.5rem; color: rgba(255,255,255,0.7); text-transform: uppercase;">Nama Lengkap</label>
                    <input type="text" id="fullName" class="glass-input" placeholder="John Doe" required>
                </div>
                <div>
                    <label style="display: block; font-size: 0.75rem; margin-bottom: 0.5rem; color: rgba(255,255,255,0.7); text-transform: uppercase;">Email</label>
                    <input type="email" id="email" class="glass-input" placeholder="nama@email.com" required>
                </div>
                <div>
                    <label style="display: block; font-size: 0.75rem; margin-bottom: 0.5rem; color: rgba(255,255,255,0.7); text-transform: uppercase;">Password</label>
                    <input type="password" id="password" class="glass-input" placeholder="Min. 6 karakter" required minlength="6">
                </div>
                <div>
                    <label style="display: block; font-size: 0.75rem; margin-bottom: 0.5rem; color: rgba(255,255,255,0.7); text-transform: uppercase;">Konfirmasi Password</label>
                    <input type="password" id="confirmPassword" class="glass-input" placeholder="Ulangi password" required>
                </div>
                <button type="submit" id="submitBtn" class="glass-button" style="width: 100%; margin-top: 0.5rem;">
                    <span id="btnText">Daftar Sekarang</span>
                </button>
            </form>

            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: rgba(255,255,255,0.6);">
                Sudah punya akun? <a href="index.html" style="color: white; font-weight: 600; text-decoration: none;">Masuk</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
