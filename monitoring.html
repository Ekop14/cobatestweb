<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring RH & Temperature</title>
    
    <!-- Pastikan path ini sesuai dengan file CSS utamamu -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Elements (Sama seperti index/dashboard) -->
    <div class="background-mesh">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div class="noise-overlay"></div>

    <!-- Main Content -->
    <main class="monitoring-container">
        
        <!-- Card 1: Header & Global Settings -->
        <div class="glass-card">
            <h1 class="text-2xl font-bold text-center mb-6 gradient-text">
                Control Sheet Monitoring RH & Temperature
            </h1>
            
            <div class="form-grid-4">
                <div>
                    <label class="form-label">Location</label>
                    <select id="location" class="glass-input glass-select">
                        <option value="WH-FG">WH-FG</option>
                        <option value="WH-RM">WH-RM</option>
                        <option value="WH-PM">WH-PM</option>
                        <option value="__add_new__">+ Tambah Lokasi Baru</option>
                    </select>
                </div>
                
                <div>
                    <label class="form-label">Section</label>
                    <input type="text" id="section" value="STORAGE 1 (AREA POSM)" class="glass-input">
                </div>
                
                <div>
                    <label class="form-label">Year</label>
                    <input type="number" id="year" value="2026" min="2020" max="2030" class="glass-input">
                </div>

                <div style="display: flex; align-items: flex-end;">
                    <div id="dataCountBadge" class="card-badge" style="width: 100%; text-align: center; padding: 0.75rem;">
                        Total Data: <span id="dataCount" style="color: white; font-weight: bold;">0</span>
                    </div>
                </div>
            </div>

            <!-- Modal Tambah Lokasi -->
            <div id="addLocationModal" class="location-modal hidden">
                <div style="display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 200px;">
                        <label class="form-label">Nama Lokasi Baru</label>
                        <input type="text" id="newLocation" placeholder="Contoh: WH-NEW" class="glass-input">
                    </div>
                    <button onclick="addLocation()" class="glass-button" style="padding: 0.75rem 1.5rem; white-space: nowrap;">✓ Tambah</button>
                    <button onclick="cancelAddLocation()" class="glass-button-outline" style="padding: 0.75rem 1.5rem; white-space: nowrap;">✕ Batal</button>
                </div>
            </div>
        </div>

        <!-- Card 2: Input Form -->
        <div class="glass-card">
            <h2 class="text-lg font-bold mb-4 flex items-center gap-3" style="color: rgba(255,255,255,0.9);">
                <span class="glass-icon" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem;">📝</span>
                Input Data Harian
            </h2>

            <form id="inputForm" style="display: flex; flex-direction: column; gap: 1.5rem;">
                <div class="form-grid-4">
                    <div>
                        <label class="form-label">Tanggal</label>
                        <input type="date" id="inputDate" required class="glass-input">
                    </div>
                    <div>
                        <label class="form-label">Waktu Cek</label>
                        <select id="inputTime" required class="glass-input glass-select">
                            <option value="8:00 AM">8:00 AM (Pagi)</option>
                            <option value="1:00 PM">1:00 PM (Siang)</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label">Temperature (°C)</label>
                        <input type="number" id="inputTemp" step="0.1" min="-10" max="60" required placeholder="0.0" class="glass-input">
                    </div>
                    <div>
                        <label class="form-label">RH (%)</label>
                        <input type="number" id="inputRH" step="0.1" min="0" max="100" required placeholder="0.0" class="glass-input">
                    </div>
                </div>

                <div class="form-grid-2">
                    <div>
                        <label class="form-label">PIC Sign (Nama)</label>
                        <input type="text" id="inputPIC" required placeholder="Nama penanggung jawab" class="glass-input">
                    </div>
                    <div>
                        <label class="form-label">Remark</label>
                        <input type="text" id="inputRemark" placeholder="Catatan kondisi (opsional)" class="glass-input">
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="no-print" style="display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 0.5rem;">
                    <button type="submit" class="glass-button">
                        <span>💾</span> Simpan Data
                    </button>
                    <button type="button" onclick="resetForm()" class="glass-button-outline">
                        <span>🔄</span> Reset Form
                    </button>
                    <button type="button" onclick="exportToCSV()" class="glass-button-outline" style="border-color: rgba(139, 92, 246, 0.4); color: #c4b5fd;">
                        <span>📊</span> Export CSV
                    </button>
                </div>
            </form>
        </div>

        <!-- Card 3: Data Table -->
        <div class="glass-card">
            <h2 class="text-lg font-bold mb-4 flex items-center gap-3" style="color: rgba(255,255,255,0.9);">
                <span class="glass-icon" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem;">📋</span>
                Riwayat Monitoring
            </h2>

            <div class="glass-table-container">
                <table class="glass-table">
                    <thead>
                        <tr>
                            <th rowspan="2" style="width: 40px;">No</th>
                            <th rowspan="2">Date</th>
                            <th colspan="4">Time of Checking</th>
                            <th rowspan="2">PIC Sign</th>
                            <th rowspan="2">Remark</th>
                            <th rowspan="2" class="no-print" style="width: 80px;">Aksi</th>
                        </tr>
                        <tr>
                            <th>8:00 AM<br><span style="font-weight: 400; font-size: 0.7rem; opacity: 0.7;">Temp(°C)</span></th>
                            <th>RH(%)</th>
                            <th>1:00 PM<br><span style="font-weight: 400; font-size: 0.7rem; opacity: 0.7;">Temp(°C)</span></th>
                            <th>RH(%)</th>
                        </tr>
                    </thead>
                    <tbody id="dataTable">
                        <tr>
                            <td colspan="9" class="empty-state">Belum ada data. Silakan isi form di atas.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Pastikan path ini sesuai dengan file JS utamamu -->
    <script src="js/monitoring.js"></script>
</body>
</html>
